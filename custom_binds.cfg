# ======================================================================= #
#                               NOTE: Binds                               #
# ======================================================================= #
# NOTE: Movement
bind "scancode26" "+forward"; // scancode26 = W
bind "scancode22" "+back"; // scancode22 = S
bind "scancode4" "+left"; // scancode4 = A
bind "scancode7" "+right"; // scancode7 = D

# NOTE: Miscellaneous
bind "scancode53" "toggleconsole"; // scancode53 = ` (backtick)
bind "scancode17" "+spinbot"; // scancode17 = N
bind "scancode44" "+jump"; // scancode44 = SPACE
bind "scancode57" "noclip"; // scancode57 = CAPSLOCK
bind "scancode8" "+use;"; // scancode8 = E (+cleardecals)
bind "scancode20" "lastinv"; // scancode20 = Q
bind "scancode29" "player_ping"; // scancode29 = Z

# NOTE: Mouse
bind "mouse1" "+attack"; // mouse1 = left click (no keyboard scancode)
bind "mouse2" "+attack2"; // mouse2 = right click (no keyboard scancode)
bind "mwheelup" "invprev"; // mwheelup = wheel up (no keyboard scancode)
bind "mwheeldown" "+JUMP"; // mwheeldown = wheel down (no keyboard scancode)
bind "mouse4" "+voicerecord"; // mouse4 = side button (no keyboard scancode)
unbind "mouse3";
unbind "mouse5";

# NOTE: Buy
bind "f3" "autobuy"

# NOTE: Communication
bind "scancode18" "voice_modenable_toggle"; // scancode18 = O

# NOTE: Item binds
# bind "x" "+quickgrenaderadial"; # quick grenade radial menu
bind "scancode25" "+bomb"; // scancode25 = V (drop bomb)

# NOTE: Rethrow
bind "scancode6" "rethrow"; // scancode6 = C

# Chat
# bind "," "trashtalker"
bind "scancode55" "say ¯\_(ツ)_/¯"; // scancode55 = .
# bind "scancode54" "callvote timeout"; // scancode54 = ,

# Grenades
bind "scancode54" "ent_fire smokegrenade_projectile kill;ent_fire molotov_projectile kill;ent_fire flashbang_projectile kill;ent_fire hegrenade_projectile kill;ent_fire decoy_projectile kill;stopsound"; // scancode54 = ,
