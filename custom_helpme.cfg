echoln " "
echoln "-------------    GENERAL     ----------------"
echoln "config    : Execute config.cfg"
echoln "path      : see the path of the config file"
echoln "dc        : disconnects from current server"
echoln "q         : quits the game completely"
echoln "rt        : retry last connection (reconnect to server)"
echoln "showbinds       : shows all your binds in console"
echoln "showviewmodel   : shows your viewmodel settings in console (custom_showviewmodel.cfg)"
echoln "showcrosshair   : shows your crosshair settings in console (custom_showcrosshair.cfg)"
echoln " "
echoln "-------------    CROSSHAIR    ---------------"
echoln "crosshair0       : yellow classic cross (custom_crosshair.cfg)"
echoln "crosshair1       : pink cross with outline (custom_crosshair1.cfg)"
echoln "crosshair2       : pink thin cross (custom_crosshair2.cfg)"
echoln "crosshair3       : green compact static cross (custom_crosshair3.cfg)"
echoln "crosshair4       : cyan T-style cross with outline (custom_crosshair4.cfg)"
echoln " "
echoln "showsys        : shows system information"
echoln "showvars       : shows changed convars"
echoln "enable_switchhands : enables switchhands"
echoln "disable_switchhands : disables switchhands"
echoln " "
echoln "-------------------- 1v1 --------------------"
echoln "1v1              : 1v1 mode configure"
echoln "1v1_deagle       : 1v1 mode with deagle"
echoln "1v1_awp          : 1v1 mode with awp"
echoln "1v1_start        : starts the 1v1 mode"
echoln " "
echoln "-------------    PRACTICE     ---------------"
echoln "practice         : Practice mode"
echoln "givenades        : Practice grenades"
echoln "rethrow          : Rethrow last grenade"
echoln "custom_resetvars : resets the server convars"
echoln " "
echoln "-------------      ARCHIVE       ------------"
echoln "tt            : initializes the trashtalker from https://jkctech.nl/projects/csgo-trashtalk-generator/"
echoln "ttpy          : initializes your custom python trashtalker (english)"
echoln "ttru          : initializes your custom python trashtalker (russian)" 
echoln " "
echoln "---------------    Binds     ----------------"
key_findbinding "+voicerecord"
key_findbinding "rethrow"
key_findbinding "+bomb"
key_findbinding "mute-team"
key_findbinding "+quickgrenaderadial"
key_findbinding "voice_modenable_toggle"
key_findbinding "+spinbot"
key_findbinding "noclip"
