// Better comment syntax
alias "#" "//"

# NOTE: Path
alias "cfg_path" "echo C:\Program Files (x86)\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg"

# NOTE: Help
alias "helpme" "exec custom_helpme.cfg"

# NOTE: Aliases
alias "showbinds" "key_listboundkeys"
alias "showsys" "sys_info"
alias "showvars" "print_changed_convars"

# NOTE: Slot binds
alias "css_0" ""
alias "css_1" ""
alias "css_2" ""
alias "css_3" ""
alias "css_4" ""
alias "css_5" ""
alias "css_6" ""
alias "css_7" ""
alias "css_8" ""
alias "css_9" ""
alias "slotbind_on_1" "slot1;switchhands;css_1;"
alias "slotbind_on_2" "slot2;switchhands;css_2;"
alias "slotbind_on_3" "slot3;switchhands;css_3;"
alias "slotbind_on_4" "slot4;switchhands;css_4;"
alias "slotbind_on_5" "slot5;switchhands;css_5;"
alias "slotbind_on_6" "slot6;switchhands;css_6;"
alias "slotbind_on_7" "slot7;switchhands;css_7;"
alias "slotbind_on_8" "slot8;switchhands;css_8;"
alias "slotbind_on_9" "slot9;switchhands;css_9;"
alias "slotbind_on_0" "slot10;switchhands;css_0;"
alias "slotbind_off_1" "slot1;css_1;"
alias "slotbind_off_2" "slot2;css_2;"
alias "slotbind_off_3" "slot3;css_3;"
alias "slotbind_off_4" "slot4;css_4;"
alias "slotbind_off_5" "slot5;css_5;"
alias "slotbind_off_6" "slot6;css_6;"
alias "slotbind_off_7" "slot7;css_7;"
alias "slotbind_off_8" "slot8;css_8;"
alias "slotbind_off_9" "slot9;css_9;"
alias "slotbind_off_0" "slot10;css_0;"
alias "enable_switchhands" "bind 1 slotbind_on_1;bind 2 slotbind_on_2;bind 3 slotbind_on_3;bind 4 slotbind_on_4;bind 5 slotbind_on_5;bind 6 slotbind_on_6;bind 7 slotbind_on_7;bind 8 slotbind_on_8;bind 9 slotbind_on_9;bind 0 slotbind_on_0;"
alias "disable_switchhands" "bind 1 slotbind_off_1;bind 2 slotbind_off_2;bind 3 slotbind_off_3;bind 4 slotbind_off_4;bind 5 slotbind_off_5;bind 6 slotbind_off_6;bind 7 slotbind_off_7;bind 8 slotbind_off_8;bind 9 slotbind_off_9;bind 0 slotbind_off_0;"

# NOTE: Config files
alias "config" "exec config.cfg"
alias "showviewmodel" "exec custom_showviewmodel.cfg"
alias "showcrosshair" "exec custom_showcrosshair.cfg"
alias "practice" "exec practice.cfg"
alias "givenades" "exec practice_grenades.cfg"
alias "fun" "exec custom_fun.cfg"
alias "reset" "exec custom_resetvars.cfg"
alias "1v1" "exec 1v1.cfg"
alias "1v1_deagle" "exec 1v1_deagle.cfg"
alias "1v1_awp" "exec 1v1_start.cfg"

# NOTE: Quit and DC
alias q "quit"
alias dc "disconnect"
alias rt "retry"

# NOTE: Grenade practice
alias "rethrow" "sv_rethrow_last_grenade"

# NOTE: Bomb throw
alias "+bomb" "slot3; slot5;"
alias "-bomb" "drop; slot2; slot1;"

# note: Fakeflash, bitch
alias "+fakeflash" "use weapon_knife; slot2;"
alias "-fakeflash" "drop; slot1;"

# NOTE: Mute team
alias "mute-team" "clutchon"
alias "clutchon" "voice_enable 0; alias mute-team clutchoff"
alias "clutchoff" "voice_enable 1; alias mute-team clutchon"

# NOTE: Spinbot
alias "+spinbot" "+right; m_yaw 99999"
alias "-spinbot" "-right; m_yaw 0.022"

echoln "Custom aliases loaded! Type 'helpme' for more information."