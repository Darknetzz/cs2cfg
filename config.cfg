// NOTE: Custom aliases
exec custom_aliases

# NOTE: Sensitivity
# sensitivity 0.6

# NOTE: Graphics
fps_max 0
r_drawtracers_firstperson 1
r_drawparticles 0

# NOTE: Radar settings
cl_radar_always_centered 0
cl_radar_scale 0.3
cl_hud_radar_scale 1.15
cl_radar_icon_scale_min 1
cl_radar_rotate 1
cl_radar_square_with_scoreboard 0

# NOTE: HUD
hud_scaling 0.8
hud_showtargetid 1
+cl_show_team_equipment
cl_teamid_overhead_mode 3

# NOTE: Viewmodel
viewmodel_fov 68;
viewmodel_offset_x 10;
viewmodel_offset_y 10;
viewmodel_offset_z -10;

# NOTE: Damage without opening console (removed because annoying)
developer 0

# NOTE: Favorite Color
cl_color 0

# NOTE: Autobuy
cl_autobuy "vesthelm vest m4a1 m4a1_silencer ak47 defuser"

# NOTE: Remove annoyances
cl_versus_intro 0
cl_allow_animated_avatars 0

# NOTE: Experimental settings
# hostname_in_client_status 1
joystick 0

# NOTE: Sound
snd_deathcamera_volume 0
snd_musicvolume 0
snd_mvp_volume 0.020
snd_roundend_volume 0
snd_roundstart_volume 0


# ======================================================================= #
#                               NOTE: Binds                               #
# ======================================================================= #
# NOTE: Miscellaneous
bind "`" "toggleconsole";
bind "n" "+spinbot";
bind "space" "+jump";
bind "capslock" "noclip";
bind "e" "+use;"; # +cleardecals
bind "q" "lastinv"

# NOTE: Mouse
bind "mwheelup" "invprev";
bind "mwheeldown" "+JUMP";
bind "mouse4" "+voicerecord";
bind "mouse5" "";

# NOTE: Communication
bind "o" "voice_modenable_toggle";

# NOTE: Item binds
bind "x" "+quickgrenaderadial"; # quick grenade radial menu
bind "v" "+bomb"; # drop bomb

# NOTE: Rethrow
bind "c" "rethrow";

# Chat
# bind "," "trashtalker"
bind "." "say ¯\_(ツ)_/¯"
bind "," "callvote timeout"

# Grenades
bind "," "ent_fire smokegrenade_projectile kill;ent_fire molotov_projectile kill;ent_fire flashbang_projectile kill;ent_fire hegrenade_projectile kill;ent_fire decoy_projectile kill;stopsound"

# Weaponbinds
bind 1 "slot1; switchhands;"; # toggle cl_righthand;"
bind 2 "slot2; switchhands;"; # toggle cl_righthand;"
bind 3 "slot3; switchhands;"; # toggle cl_righthand;"
bind 4 "slot4; switchhands;"; # toggle cl_righthand;"

# NOTE: Custom (helpme.cfg)
exec helpme