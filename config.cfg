echo ! [EXECUTING CONFIG.CFG] !

// Better comment syntax
alias "#" "//"

# Graphics
fps_max 0
# r_dynamic 0
# r_drawparticles 1
r_drawtracers_firstperson 0
r_drawparticles 0

# General settings
# cl_autowepswitch 0
# closeonbuy 0
# hud_takesshots 1
# cl_forcepreload 1
# cl_disablefreezecam 1

# Connection settings (THIS FUCKING SHIT GOT ME A COOLDOWN)
# net_client_steamdatagram_enable_override -1 # Disable SDR once and for all, unable to reconnect to MM

# Radar settings
cl_radar_always_centered 0
cl_radar_scale 0.3
cl_hud_radar_scale 1.15
cl_radar_icon_scale_min 1
cl_radar_rotate 1

# HUD
hud_scaling 0.8
hud_showtargetid 1
# cl_hud_background_alpha "0.1"
# cl_hud_bomb_under_radar 1
# cl_hud_color 4
# cl_hud_playercount_showcount 0
+cl_show_team_equipment
# cl_teamid_overhead_always 1
# cl_showpos 0
# net_graph 1

# Crosshair (coldzera)
# exec crosshair_coldzera

# Viewmodel
# cl_righthand 1
viewmodel_fov 68;
viewmodel_offset_x 10;
viewmodel_offset_y 10;
viewmodel_offset_z -10;
# cl_bobcycle 1.5
# cl_bob_lower_amt 0;
# cl_bobamt_lat 0;
# cl_bobamt_vert 0;
# cl_viewmodel_shift_left_amt 0;

# Network
rate 128000
# cl_cmdrate 128
# cl_updaterate 128
# cl_interp "0.075"
# cl_interp_ratio 1
# cl_lagcompensation 1


# [Console] SV: Cheat command 'cl_removedecals' ignored.
# [Console] SV: Convar 'r_csgo_render_decals_on_translucent' is cheat protected, change ignored.
# alias "+cleardecals" "r_csgo_render_decals false; r_csgo_render_inferno_decals false; r_drawdecals false;"
# alias "-cleardecals" "r_csgo_render_decals true; r_csgo_render_inferno_decals true; r_drawdecals true;"

# Damage without opening console (removed because annoying)
developer 0

# Spinbot
alias "+spinbot" "+right; m_yaw 99999"
alias "-spinbot" "-right; m_yaw 0.022"
bind "c" "+spinbot"

# Scrolljump
bind "MWHEELDOWN" "+JUMP"


# Muteteam
bind "o" "mute-team"
alias "mute-team" "clutchon"
alias "clutchon" "voice_enable 0; alias mute-team clutchoff"
alias "clutchoff" "voice_enable 1; alias mute-team clutchon"

# Quit and DC
alias q "quit"
alias dc "disconnect"
alias rt "retry"

# use
bind "e" "+use; +cleardecals"

# Autobuy
cl_autobuy = vesthelm vest m4a1_silencer ak47 famas galilar mp7 nova defuser

# Chat
bind "," "trashtalker"
bind "." "say ¯\_(ツ)_/¯"

# # Drop bomb
alias "+dropbomb"
alias "-dropbomb"
alias "+dropbomb" "slot3; slot5;"
alias "-dropbomb" "drop; lastinv;"
bind "v" +dropbomb

# Fakeflash, bitch
alias +fakeflash "use weapon_knife; slot2"
alias -fakeflash "drop; slot1;"
# Not really working that well

# Jumpthrow
# alias +jumpthrow "+jump;-attack;-attack2"
# alias -jumpthrow "-jump;"
# bind "x" "+jumpthrow"
alias +throw "-attack;-attack2";
bind "x" "+jump;+throw";

# Jumpduck
alias "+jumpduck" "+jump; +duck"
alias "-jumpduck" "-jump; -duck"
bind "space" "+jumpduck"

# Weaponbinds
bind 1 "slot1;"; # toggle cl_righthand;"
bind 2 "slot2;"; # toggle cl_righthand;"
bind 3 "slot3;"; # toggle cl_righthand;"
bind 4 "slot4;"; # toggle cl_righthand;"

# Hidden voice commands
# bind "KP_END" "getout"
# bind "KP_DOWNARROW" "enemydown"
# bind "KP_PGDN" "takingfire"
# bind "KP_LEFTARROW" "report"
# bind "KP_5" "coverme"
# bind "KP_RIGHTARROW" "regroup"

# CL Noclip
bind "capslock" "noclip"

