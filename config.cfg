// NOTE: Custom aliases
exec custom_aliases

# NOTE: Graphics
fps_max 0
r_drawtracers_firstperson 1
r_drawparticles 0

# NOTE: Radar settings
cl_radar_always_centered 0
cl_radar_scale 0.3
cl_hud_radar_scale 1.15
cl_radar_icon_scale_min 1
cl_radar_rotate 1

# NOTE: HUD
hud_scaling 0.8
hud_showtargetid 1
+cl_show_team_equipment

# NOTE: Viewmodel
viewmodel_fov 68;
viewmodel_offset_x 10;
viewmodel_offset_y 10;
viewmodel_offset_z -10;

# NOTE: Damage without opening console (removed because annoying)
developer 0

# NOTE: Autobuy
cl_autobuy "vesthelm vest m4a1 m4a1_silencer ak47 defuser"

# NOTE: Spinbot
bind "n" "+spinbot"

# NOTE: Scrolljump
bind "MWHEELDOWN" "+JUMP"
bind "space" "+jump"

# NOTE: Muteteam
bind "o" "mute-team"

# NOTE: Drop bomb
bind "v" "+bomb"

# NOTE: use
bind "e" "+use;"; +cleardecals

# NOTE: Rethrow
bind "c" "rethrow"

# Chat
# bind "," "trashtalker"
# bind "." "say ¯\_(ツ)_/¯"

# Grenades
bind , "ent_fire smokegrenade_projectile kill;ent_fire molotov_projectile kill;ent_fire flashbang_projectile kill;ent_fire hegrenade_projectile kill;ent_fire decoy_projectile kill;stopsound"

# Weaponbinds
bind 1 "slot1; switchhands;"; # toggle cl_righthand;"
bind 2 "slot2; switchhands;"; # toggle cl_righthand;"
bind 3 "slot3; switchhands;"; # toggle cl_righthand;"
bind 4 "slot4; switchhands;"; # toggle cl_righthand;"

# CL Noclip
bind "capslock" "noclip"

# NOTE: Custom (helpme.cfg)
exec helpme.cfg